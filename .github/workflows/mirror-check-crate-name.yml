name: "Mirror: Check Crate Name"
# Mirror of alire-index/.github/workflows/check-crate-name.yml (see "Mirror workflows" in README.md)
# Reject new crates with discouraged name patterns

on:
  pull_request:

env:
  CHECKS_REPO: .

jobs:

  check:
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Check crate name
      run: ${{env.CHECKS_REPO}}/scripts/check-crate-name.sh
      shell: bash
      env:
        ALL_CRATES: TRUE
        DRY_RUN: TRUE # Sample crates like libhello have names flagged for review
