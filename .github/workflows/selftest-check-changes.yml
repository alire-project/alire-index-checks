name: Self-test check-changes script
# Runs the offline tests of scripts/check-changes.py (not an index check)

on:
  pull_request:

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Test change classification
      run: tests/test-check-changes.sh
      shell: bash
