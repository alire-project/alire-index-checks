name: "Mirror: Check Author"
# Mirror of alire-index/.github/workflows/check-authorship.yml (see "Mirror workflows" in README.md)

on:
  pull_request:

permissions:
  contents: read

env:
  CHECKS_REPO: .

jobs:

  check:
    name: "Mirror: Author" # Unique, as a required check name
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt
      shell: bash

    - name: Check author
      run: '"$CHECKS_REPO/scripts/check-author.sh" "$PR_AUTHOR"'
      shell: bash
      env:
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        ALL_CRATES: TRUE
        DRY_RUN: TRUE # The PR author does not maintain every sample crate
