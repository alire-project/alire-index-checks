name: Self-test
# Runs the offline tests of the scripts. Not index checks nor mirrors (see
# "Mirror workflows" in README.md)

on:
  pull_request:

permissions:
  contents: read

jobs:

  check-author:
    name: "Self-test: check-author" # Unique, as a required check name
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt
      shell: bash

    - name: Test author authority
      run: tests/test-check-author.sh
      shell: bash

  check-crate-name:
    name: "Self-test: check-crate-name" # Unique, as a required check name
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Test crate name check
      run: tests/test-check-crate-name.sh
      shell: bash

  check-changes:
    name: "Self-test: check-changes" # Unique, as a required check name
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Test change classification
      run: tests/test-check-changes.sh
      shell: bash

  check-automerge:
    name: "Self-test: check-automerge" # Unique, as a required check name
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt
      shell: bash

    - name: Test auto-merge eligibility
      run: tests/test-check-automerge.sh
      shell: bash
