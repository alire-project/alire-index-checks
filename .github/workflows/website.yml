name: Website
# Check manifest has a website field. Not a mirror: alire-index does not run
# it yet (see "Mirror workflows" in README.md)

on:
  pull_request:

env:
  CHECKS_REPO: .

jobs:

  check:
    name: "Website" # Unique, as a required check name
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Set up `alr`
      uses: alire-project/setup-alire@latest
      with:
        version: nightly
        toolchain: --disable-assistant # no need for it

    - name: Test crates
      run: ${{env.CHECKS_REPO}}/scripts/check-website.sh
      shell: bash
      env:
        ALL_CRATES: TRUE
        DRY_RUN: TRUE
