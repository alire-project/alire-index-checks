name: Schema
# Validate every manifest in the index against the Alire manifest JSON Schema

on:
  pull_request:
  push:

env:
  CHECKS_REPO: .
  # Alire repository providing the manifest JSON Schema.
  ALIRE_REPO: https://github.com/alire-project/alire

jobs:

  check:
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r ${{env.CHECKS_REPO}}/requirements.txt
      shell: bash

    - name: Fetch manifest schema
      run: git clone --depth 1 "$ALIRE_REPO" alire
      shell: bash

    - name: Check manifests against schema
      run: >-
        ${{env.CHECKS_REPO}}/scripts/check-schema.py
        index alire/schemas/manifest-schema.yaml
      shell: bash
