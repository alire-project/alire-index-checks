name: Schema
# Validate every manifest in the index against the Alire manifest JSON Schema

on:
  pull_request:
  push:

env:
  CHECKS_REPO: .
  # Manifest JSON Schema, fetched from the main Alire repository.
  SCHEMA_URL: https://raw.githubusercontent.com/alire-project/alire/master/schemas/manifest-schema.yaml

jobs:

  check:
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r ${{env.CHECKS_REPO}}/requirements.txt
      shell: bash

    - name: Fetch manifest schema
      run: curl -fsSL "$SCHEMA_URL" -o manifest-schema.yaml
      shell: bash

    - name: Check manifests against schema
      run: ${{env.CHECKS_REPO}}/scripts/check-schema.py index manifest-schema.yaml
      shell: bash
